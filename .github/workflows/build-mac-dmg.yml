name: Build macOS DMG

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号'
        required: false
        default: '3.0.0'
      arch:
        description: '目标架构'
        required: false
        default: 'arm64'
        type: choice
        options:
          - arm64       # Apple Silicon (M1/M2/M3)，构建最快
          - x86_64      # Intel Mac
  push:
    tags:
      - 'v*'

# 强制所有 actions 使用 Node.js 24
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-dmg:
    name: Build Self-Contained DMG
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      # ── 1. 拉取代码 ────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. 安装 Python 3.11 ────────────────────────────────────────
      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 3. 安装 Python 依赖 ────────────────────────────────────────
      - name: 安装 Python 依赖
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install "pyinstaller>=6.0" pillow

      # ── 4. 安装 ffmpeg 并复制到 bin/ ──────────────────────────────
      - name: 安装 ffmpeg
        run: |
          brew install ffmpeg
          mkdir -p bin
          cp "$(brew --prefix)/bin/ffmpeg"  bin/ffmpeg
          cp "$(brew --prefix)/bin/ffprobe" bin/ffprobe
          chmod +x bin/ffmpeg bin/ffprobe
          file bin/ffmpeg

      # ── 5. 生成应用图标 ────────────────────────────────────────────
      - name: 生成 icon.icns
        run: |
          python3 - <<'PYEOF'
          from PIL import Image, ImageDraw
          import os, subprocess

          iconset = "AutoViral.iconset"
          os.makedirs(iconset, exist_ok=True)

          sizes = [16, 32, 64, 128, 256, 512, 1024]
          for s in sizes:
              img = Image.new('RGBA', (s, s), (0, 0, 0, 0))
              d = ImageDraw.Draw(img)
              m = int(s * 0.08)
              d.rounded_rectangle([m, m, s-m, s-m], radius=int(s*0.2), fill=(15, 100, 220, 255))
              img.save(f'{iconset}/icon_{s}x{s}.png')
              if s <= 512:
                  img.resize((s*2, s*2), Image.LANCZOS).save(f'{iconset}/icon_{s}x{s}@2x.png')

          subprocess.run(['iconutil', '-c', 'icns', iconset, '-o', 'icon.icns'], check=True)
          print("icon.icns 生成成功")
          PYEOF

      # ── 6. 设置目标架构 ────────────────────────────────────────────
      - name: 设置目标架构
        run: |
          TARGET="${{ github.event.inputs.arch || 'arm64' }}"
          echo "TARGET_ARCH=${TARGET}" >> "$GITHUB_ENV"
          # 更新 spec 文件中的架构
          sed -i '' "s/target_arch=None/target_arch='${TARGET}'/" AutoViral.spec
          echo "目标架构已设置为：${TARGET}"

      # ── 7. PyInstaller 打包 ────────────────────────────────────────
      - name: PyInstaller 打包
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: |
          pyinstaller AutoViral.spec \
            --clean \
            --noconfirm \
            --log-level WARN

      # ── 8. 验证打包结果 ────────────────────────────────────────────
      - name: 验证 .app
        run: |
          APP="dist/AutoViral AI.app"
          if [[ ! -d "$APP" ]]; then
            echo "❌ .app 未生成，打包失败"
            ls -la dist/ || true
            exit 1
          fi
          echo "✅ .app 生成成功，大小："
          du -sh "$APP"
          echo "--- 内部结构 ---"
          ls "dist/AutoViral AI.app/Contents/"
          echo "--- ffmpeg ---"
          find "$APP" -name "ffmpeg" 2>/dev/null && echo "✅ ffmpeg 已打包" || echo "⚠️ ffmpeg 未找到"
          echo "--- app.py ---"
          find "$APP" -name "app.py" 2>/dev/null && echo "✅ app.py 已打包" || echo "⚠️ app.py 未找到"

      # ── 9. 移除隔离属性 ────────────────────────────────────────────
      - name: 移除隔离属性（解决 Gatekeeper）
        run: |
          xattr -cr "dist/AutoViral AI.app" 2>/dev/null || true

      # ── 10. 创建 DMG ───────────────────────────────────────────────
      - name: 创建 DMG
        run: |
          brew install create-dmg

          VERSION="${{ github.event.inputs.version || '3.0.0' }}"
          ARCH="${TARGET_ARCH}"
          DMG_NAME="AutoViral_AI_v${VERSION}_macOS_${ARCH}.dmg"
          rm -f "$DMG_NAME"

          # 尝试 create-dmg（界面美观）
          create-dmg \
            --volname "AutoViral AI" \
            --volicon "icon.icns" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 120 \
            --icon "AutoViral AI.app" 175 190 \
            --hide-extension "AutoViral AI.app" \
            --app-drop-link 425 190 \
            --no-internet-enable \
            "$DMG_NAME" \
            "dist/" \
          || {
            echo "create-dmg 失败，使用 hdiutil 创建..."
            hdiutil create \
              -volname "AutoViral AI" \
              -srcfolder "dist/" \
              -ov \
              -format UDZO \
              "$DMG_NAME"
          }

          echo "DMG_NAME=${DMG_NAME}" >> "$GITHUB_ENV"
          ls -lh "$DMG_NAME"

      # ── 11. 上传 Artifact ──────────────────────────────────────────
      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoViral-AI-macOS-${{ env.TARGET_ARCH }}
          path: "*.dmg"
          retention-days: 30

      # ── 12. Tag 触发时发布 Release ─────────────────────────────────
      - name: 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "AutoViral AI ${{ github.ref_name }}"
          body: |
            ## AutoViral AI ${{ github.ref_name }} — macOS 完全自包含安装包

            无需安装 Python、ffmpeg 或任何软件，下载即用。

            ### 安装方法
            1. 下载 `.dmg` 文件
            2. 双击打开 DMG
            3. 将 **AutoViral AI** 拖入 **Applications（应用程序）**
            4. 首次运行：右键 → 打开 → 确认打开

            ### 系统要求
            - macOS 12 Monterey 及以上
            - Apple Silicon (M1/M2/M3) 或 Intel
          files: "*.dmg"
