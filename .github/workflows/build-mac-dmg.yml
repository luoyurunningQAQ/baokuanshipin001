name: Build macOS DMG

on:
  # 手动触发（在 GitHub 页面点击 Run workflow）
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（例如 3.0.0）'
        required: false
        default: '3.0.0'
  # 也可在推送 tag 时自动触发（如 git tag v3.0.0 && git push --tags）
  push:
    tags:
      - 'v*'

jobs:
  build-dmg:
    name: Build on macOS
    runs-on: macos-14          # Apple Silicon (M1) runner，速度更快
    timeout-minutes: 60

    steps:
      # ── 1. 拉取代码 ────────────────────────────────────────────────
      - name: Checkout 代码
        uses: actions/checkout@v4

      # ── 2. 安装 Python 3.11 ────────────────────────────────────────
      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ── 3. 安装系统依赖（ffmpeg for moviepy）──────────────────────
      - name: 安装 ffmpeg
        run: brew install ffmpeg

      # ── 4. 安装 Python 依赖 + PyInstaller ─────────────────────────
      - name: 安装 Python 依赖
        run: |
          pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          pip install "pyinstaller>=6.0" pillow

      # ── 5. 生成应用图标 ────────────────────────────────────────────
      - name: 生成 icon.icns
        run: |
          python3 - <<'EOF'
          from PIL import Image, ImageDraw
          import os, subprocess

          iconset = "AutoViral.iconset"
          os.makedirs(iconset, exist_ok=True)

          sizes = [16, 32, 64, 128, 256, 512, 1024]
          for s in sizes:
              img = Image.new('RGBA', (s, s), (15, 90, 200, 255))
              d = ImageDraw.Draw(img)
              # 绘制简单图标文字
              margin = s // 6
              d.ellipse([margin, margin, s-margin, s-margin], fill=(255,255,255,60))
              img.save(f'{iconset}/icon_{s}x{s}.png')
              if s <= 512:
                  img2 = img.resize((s*2, s*2), Image.LANCZOS)
                  img2.save(f'{iconset}/icon_{s}x{s}@2x.png')

          subprocess.run(['iconutil', '-c', 'icns', iconset, '-o', 'icon.icns'], check=True)
          print("icon.icns 生成完成")
          EOF

      # ── 6. PyInstaller 打包 ────────────────────────────────────────
      - name: PyInstaller 打包
        run: |
          pyinstaller AutoViral.spec \
            --clean \
            --noconfirm \
            --log-level WARN

      # ── 7. 验证 .app 生成 ──────────────────────────────────────────
      - name: 验证打包结果
        run: |
          ls -lh "dist/"
          test -d "dist/AutoViral AI.app" && echo "✓ .app 生成成功" || (echo "✗ .app 未找到" && exit 1)

      # ── 8. 安装 create-dmg ─────────────────────────────────────────
      - name: 安装 create-dmg
        run: brew install create-dmg

      # ── 9. 创建 DMG ────────────────────────────────────────────────
      - name: 创建 DMG 安装包
        run: |
          VERSION="${{ github.event.inputs.version || '3.0.0' }}"
          DMG_NAME="AutoViral_AI_v${VERSION}.dmg"

          create-dmg \
            --volname "AutoViral AI" \
            --volicon "icon.icns" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "AutoViral AI.app" 175 190 \
            --hide-extension "AutoViral AI.app" \
            --app-drop-link 425 190 \
            --no-internet-enable \
            "${DMG_NAME}" \
            "dist/" \
          || {
            echo "create-dmg 失败，回退到 hdiutil..."
            hdiutil create \
              -volname "AutoViral AI" \
              -srcfolder "dist/" \
              -ov -format UDZO \
              "${DMG_NAME}"
          }

          echo "DMG_NAME=${DMG_NAME}" >> $GITHUB_ENV
          ls -lh "${DMG_NAME}"

      # ── 10. 上传 DMG 为 Artifact（7天内可下载）────────────────────
      - name: 上传 DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoViral-AI-macOS-DMG
          path: "*.dmg"
          retention-days: 7

      # ── 11. 如果是 tag 触发，自动创建 GitHub Release ───────────────
      - name: 创建 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "AutoViral AI ${{ github.ref_name }}"
          body: |
            ## AutoViral AI ${{ github.ref_name }} — macOS 安装包

            ### 安装方法
            1. 下载 `AutoViral_AI_*.dmg`
            2. 双击打开 DMG
            3. 将 **AutoViral AI** 拖入 **Applications（应用程序）** 文件夹
            4. 首次运行：右键 → 打开 → 确认打开

            ### 系统要求
            - macOS 12 Monterey 及以上
            - 支持 Apple Silicon (M1/M2/M3) 和 Intel
          files: "*.dmg"
          draft: false
          prerelease: false
